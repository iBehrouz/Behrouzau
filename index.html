<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Behrouz</title>
  <style>
    :root {
      --bg-color: #030303;
      --card-bg: #090909;
      --accent-color: #c4823f;
      --terminal-green: #33ff33;
      --text-main: #e0e0e0;
      --text-muted: #555555;
      --border-color: #1c1c1c;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 1rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient mobile background bloom */
    .ambient-glow {
      position: fixed;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80vw;
      height: 80vw;
      background: radial-gradient(circle, rgba(196, 130, 63, 0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 1;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: auto;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .top-glow-line {
      width: 36px;
      height: 2px;
      background: var(--accent-color);
      margin: 0 auto 2rem auto;
      box-shadow: 0 0 12px var(--accent-color);
      opacity: 0.8;
    }

    .terminal-window {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.25rem;
      text-align: left;
      font-family: monospace;
      font-size: 0.9rem;
      color: var(--terminal-green);
      box-shadow: 0 20px 40px rgba(0,0,0,0.9);
      cursor: text;
      position: relative;
    }

    .terminal-window.drag-active {
      border-color: var(--accent-color);
      box-shadow: 0 0 25px rgba(196, 130, 63, 0.3);
    }

    .terminal-output {
      margin-bottom: 1rem;
      white-space: pre-wrap;
      line-height: 1.6;
      max-height: 260px;
      overflow-y: auto;
      text-shadow: 0 0 6px rgba(51, 255, 51, 0.25);
    }

    /* Contact icon bar optimized for mobile fingers */
    .contact-icons-bar {
      display: none;
      gap: 10px;
      font-size: 0.82rem;
      padding: 8px 0 10px 0;
      color: var(--accent-color);
      border-top: 1px dashed #1a1a1a;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }

    .contact-icons-bar.visible {
      display: flex;
    }

    .terminal-input-line {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      border-top: 1px solid #141414;
      padding-top: 0.8rem;
    }

    .prompt-symbol { color: var(--accent-color); font-weight: bold; font-size: 1rem; }

    /* 16px font size prevents iOS/Android from auto-zooming when focused */
    .terminal-input {
      background: transparent;
      border: none;
      color: var(--terminal-green);
      font-family: monospace;
      outline: none;
      width: 100%;
      font-size: 16px; 
      text-shadow: 0 0 6px rgba(51, 255, 51, 0.25);
    }

    footer { 
      font-size: 0.7rem; 
      color: var(--text-muted); 
      letter-spacing: 0.5px;
      padding-top: 1rem;
      position: relative;
      z-index: 2;
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <div class="container">
    <div class="top-glow-line"></div>

    <div class="terminal-window" id="terminal-window">
      <div class="terminal-output" id="terminal-output">ready. Type a message.</div>
      
      <div class="contact-icons-bar" id="contactIconsBar">
        <span>💬 @username</span> &nbsp;•&nbsp; <span>✉ email</span> &nbsp;•&nbsp; <span>📞 number</span>
      </div>

      <div class="terminal-input-line">
        <span class="prompt-symbol">&gt;</span>
        <input type="text" class="terminal-input" id="terminal-input" autocomplete="off" spellcheck="false">
      </div>
    </div>
  </div>

  <footer>
    © 2026 Behrouz. All rights reserved.
  </footer>

  <script>
    const WORKER_URL = 'https://codetel.behrouz-4b1.workers.dev';

    const termWindow = document.getElementById('terminal-window');
    const termInput = document.getElementById('terminal-input');
    const termOutput = document.getElementById('terminal-output');
    const contactIconsBar = document.getElementById('contactIconsBar');

    let userContact = localStorage.getItem('visitor_handle') || '';
    let pendingMessage = '';

    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    document.body.appendChild(fileInput);

    termWindow.addEventListener('click', () => termInput.focus());

    async function sendMessage(msg, contactInfo) {
      termOutput.textContent += `\nSending...`;
      termOutput.scrollTop = termOutput.scrollHeight;

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg, contact: contactInfo || "Anonymous" })
        });

        if (res.ok) {
          termOutput.textContent += `\nDelivered.`;
        } else {
          termOutput.textContent += `\nFailed.`;
        }
      } catch (err) {
        termOutput.textContent += `\nNetwork error.`;
      }
      termOutput.scrollTop = termOutput.scrollHeight;
    }

    async function sendFile(file, method = "upload") {
      if (!file) return;
      termOutput.textContent += `\n\n> ${method}\nUploading [${file.name}]...`;
      termOutput.scrollTop = termOutput.scrollHeight;

      const formData = new FormData();
      formData.append('file', file);

      try {
        const res = await fetch(WORKER_URL, { method: 'POST', body: formData });
        if (res.ok) {
          termOutput.textContent += `\nDelivered.`;
        } else {
          termOutput.textContent += `\nFailed.`;
        }
      } catch (err) {
        termOutput.textContent += `\nNetwork error.`;
      }
      termOutput.scrollTop = termOutput.scrollHeight;
    }

    fileInput.addEventListener('change', (e) => {
      sendFile(e.target.files[0], "upload");
      fileInput.value = '';
    });

    termInput.addEventListener('keydown', async (e) => {
      if (e.key === 'Enter') {
        const rawVal = termInput.value.trim();
        if (!rawVal) return;
        termInput.value = '';

        if (rawVal.toLowerCase() === 'clear') {
          termOutput.textContent = 'ready.';
          contactIconsBar.classList.remove('visible');
          return;
        }

        if (rawVal.toLowerCase() === 'upload') {
          fileInput.click();
          return;
        }

        if (pendingMessage) {
          userContact = rawVal;
          localStorage.setItem('visitor_handle', userContact);
          contactIconsBar.classList.remove('visible');
          termOutput.textContent += `\n> ${userContact}`;
          const msgToSend = pendingMessage;
          pendingMessage = '';
          await sendMessage(msgToSend, userContact);
          return;
        }

        if (!userContact) {
          pendingMessage = rawVal;
          contactIconsBar.classList.add('visible');
          termOutput.textContent += `\n\n> ${rawVal}\nEnter your contact info:`;
          termOutput.scrollTop = termOutput.scrollHeight;
          return;
        }

        termOutput.textContent += `\n\n> ${rawVal}`;
        await sendMessage(rawVal, userContact);
      }
    });
  </script>
</body>
</html>
