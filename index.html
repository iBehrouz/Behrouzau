<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Behrouz</title>
  <style>
    :root {
      --bg-color: #0d0d0d;
      --card-bg: #161616;
      --accent-color: #c4823f;
      --text-main: #e0e0e0;
      --text-muted: #888888;
      --border-color: #262626;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 2rem 1rem;
      overflow-x: hidden;
      position: relative;
    }

    .spotlight {
      pointer-events: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(600px circle at var(--x, 50%) var(--y, 50%), rgba(196, 130, 63, 0.08), transparent 80%);
      z-index: 1;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: auto;
      text-align: center;
      z-index: 2;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #4CAF50;
      border-radius: 50%;
      box-shadow: 0 0 8px #4CAF50;
    }

    .terminal-window {
      background: #050505;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.25rem;
      text-align: left;
      font-family: monospace;
      font-size: 0.85rem;
      color: #33ff33;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    /* Highlight class for drag-and-drop */
    .terminal-window.drag-active {
      border-color: var(--accent-color);
      box-shadow: 0 0 20px rgba(196, 130, 63, 0.3);
    }

    .terminal-output {
      margin-bottom: 0.75rem;
      white-space: pre-wrap;
      line-height: 1.5;
      max-height: 320px;
      overflow-y: auto;
    }

    .terminal-input-line {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-top: 1px solid #1a1a1a;
      padding-top: 0.75rem;
    }

    .prompt-symbol {
      color: var(--accent-color);
      font-weight: bold;
    }

    .terminal-input {
      background: transparent;
      border: none;
      color: #33ff33;
      font-family: monospace;
      outline: none;
      width: 100%;
      font-size: 0.85rem;
    }

    footer {
      font-size: 0.8rem;
      color: var(--text-muted);
      z-index: 2;
    }

    footer a {
      color: var(--text-muted);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="spotlight" id="spotlight"></div>

  <div class="container">
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>Behrouz</span>
    </div>

    <div class="terminal-window" id="terminal-window">
      <div class="terminal-output" id="terminal-output">Ready.</div>
      <div class="terminal-input-line">
        <span class="prompt-symbol">&gt;</span>
        <input type="text" class="terminal-input" id="terminal-input" autofocus autocomplete="off" spellcheck="false">
      </div>
    </div>
  </div>

  <footer>
    © 2026 Behrouz. All rights reserved. • <a href="https://behrouz.au">behrouz.au</a>
  </footer>

  <script>
    const WORKER_URL = 'https://codetel.behrouz-4b1.workers.dev';

    const spotlight = document.getElementById('spotlight');
    window.addEventListener('mousemove', (e) => {
      spotlight.style.setProperty('--x', `${e.clientX}px`);
      spotlight.style.setProperty('--y', `${e.clientY}px`);
    });

    const termWindow = document.getElementById('terminal-window');
    const termInput = document.getElementById('terminal-input');
    const termOutput = document.getElementById('terminal-output');

    // Hidden file input for typing "upload"
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    document.body.appendChild(fileInput);

    termWindow.addEventListener('click', () => {
      termInput.focus();
    });

    // Core file upload function (handles both drag/drop and manual picking)
    async function processFile(file, method = "upload") {
      if (!file) return;

      termOutput.textContent += `\n\n> ${method}\nUploading [${file.name}]...`;
      termWindow.scrollTop = termWindow.scrollHeight;

      const formData = new FormData();
      formData.append('file', file);

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          body: formData 
        });

        if (res.ok) {
          termOutput.textContent += `\nFile delivered.`;
        } else {
          termOutput.textContent += `\nFile failed to send.`;
        }
      } catch (err) {
        termOutput.textContent += `\nNetwork error.`;
      }
      
      termWindow.scrollTop = termWindow.scrollHeight;
    }

    // Handle Manual File Selection
    fileInput.addEventListener('change', (e) => {
      processFile(e.target.files[0], "upload");
      fileInput.value = ''; // Reset input
    });

    // Handle Drag & Drop Events
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      window.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
      }, false);
    });

    ['dragenter', 'dragover'].forEach(eventName => {
      window.addEventListener(eventName, () => {
        termWindow.classList.add('drag-active');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      window.addEventListener(eventName, () => {
        termWindow.classList.remove('drag-active');
      }, false);
    });

    window.addEventListener('drop', (e) => {
      const file = e.dataTransfer.files[0];
      processFile(file, "drag_and_drop");
    }, false);

    // Handle Text Input
    termInput.addEventListener('keydown', async (e) => {
      if (e.key === 'Enter') {
        const rawVal = termInput.value.trim();
        
        if (!rawVal) return;
        termInput.value = '';

        if (rawVal.toLowerCase() === 'clear') {
          termOutput.textContent = 'Ready. Type "upload" or drag & drop a file here.';
          return;
        }

        if (rawVal.toLowerCase() === 'upload') {
          fileInput.click();
          return;
        }

        termOutput.textContent += `\n\n> ${rawVal}\nSending...`;
        termWindow.scrollTop = termWindow.scrollHeight;

        try {
          const res = await fetch(WORKER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: rawVal })
          });

          if (res.ok) {
            termOutput.textContent += `\nDelivered.`;
          } else {
            termOutput.textContent += `\nFailed.`;
          }
        } catch (err) {
          termOutput.textContent += `\nNetwork error.`;
        }

        termWindow.scrollTop = termWindow.scrollHeight;
      }
    });
  </script>
</body>
</html>
