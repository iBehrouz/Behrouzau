<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0c">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Behrouz</title>
  <style>
    :root {
      --bg-color: #0a0a0c;
      --card-bg: #141418;
      --accent-color: #ff5500; /* Vibrant Up-style orange energy */
      --terminal-green: #33ff33;
      --text-main: #f4f4f6;
      --text-muted: #888892;
      --border-color: #22222a;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.25rem;
      max-width: 500px;
      margin: 0 auto;
    }

    /* App-like top brand header */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0.25rem 1rem 0.25rem;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
    }

    .brand-title span {
      color: var(--accent-color);
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 85, 0, 0.1);
      border: 1px solid rgba(255, 85, 0, 0.2);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent-color);
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      background-color: var(--accent-color);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-color);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    /* Main Terminal Card filling the mobile screen nicely */
    .terminal-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex: 1;
      margin-bottom: 1rem;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
    }

    .terminal-output {
      flex: 1;
      white-space: pre-wrap;
      line-height: 1.6;
      font-family: monospace;
      font-size: 0.88rem;
      color: var(--terminal-green);
      overflow-y: auto;
      margin-bottom: 1rem;
      text-shadow: 0 0 6px rgba(51, 255, 51, 0.2);
    }

    /* Contact icon options bar */
    .contact-icons-bar {
      display: none;
      gap: 12px;
      font-size: 0.85rem;
      padding: 8px 0 12px 0;
      color: var(--accent-color);
      border-top: 1px dashed #2a2a35;
      margin-bottom: 6px;
      flex-wrap: wrap;
      font-family: monospace;
    }

    .contact-icons-bar.visible {
      display: flex;
    }

    .terminal-input-line {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      border-top: 1px solid var(--border-color);
      padding-top: 0.9rem;
    }

    .prompt-symbol { 
      color: var(--accent-color); 
      font-weight: 800; 
      font-family: monospace;
      font-size: 1.1rem;
    }

    /* 16px prevents mobile auto-zoom */
    .terminal-input {
      background: transparent;
      border: none;
      color: var(--terminal-green);
      font-family: monospace;
      outline: none;
      width: 100%;
      font-size: 16px; 
      text-shadow: 0 0 6px rgba(51, 255, 51, 0.2);
    }

    footer { 
      text-align: center;
      font-size: 0.75rem; 
      color: var(--text-muted); 
      padding-bottom: 0.5rem;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="brand-title">behrouz<span>.</span>au</div>
    <div class="live-badge">
      <span class="pulse-dot"></span>
      <span>ONLINE</span>
    </div>
  </header>

  <!-- Terminal Card Container -->
  <div class="terminal-card" id="terminalCard">
    <div class="terminal-output" id="terminal-output">ready. Type a message, type 'upload', or drop files here.</div>
    
    <div class="contact-icons-bar" id="contactIconsBar">
      <span>💬 @username</span> &nbsp;•&nbsp; <span>✉ email</span> &nbsp;•&nbsp; <span>📞 number</span>
    </div>

    <div class="terminal-input-line">
      <span class="prompt-symbol">&gt;</span>
      <input type="text" class="terminal-input" id="terminal-input" autocomplete="off" spellcheck="false">
    </div>
  </div>

  <footer>
    © 2026 • Secure Direct Channel
  </footer>

  <script>
    const WORKER_URL = 'https://codetel.behrouz-4b1.workers.dev';

    const terminalCard = document.getElementById('terminalCard');
    const termInput = document.getElementById('terminal-input');
    const termOutput = document.getElementById('terminal-output');
    const contactIconsBar = document.getElementById('contactIconsBar');

    let userContact = localStorage.getItem('visitor_handle') || '';
    let pendingMessage = '';

    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    document.body.appendChild(fileInput);

    terminalCard.addEventListener('click', () => termInput.focus());

    async function sendMessage(msg, contactInfo) {
      termOutput.textContent += `\nSending...`;
      termOutput.scrollTop = termOutput.scrollHeight;

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg, contact: contactInfo || "Anonymous" })
        });

        if (res.ok) {
          termOutput.textContent += `\nDelivered.`;
        } else {
          termOutput.textContent += `\nFailed.`;
        }
      } catch (err) {
        termOutput.textContent += `\nNetwork error.`;
      }
      termOutput.scrollTop = termOutput.scrollHeight;
    }

    async function sendFile(file, method = "upload") {
      if (!file) return;
      termOutput.textContent += `\n\n> ${method}\nUploading [${file.name}]...`;
      termOutput.scrollTop = termOutput.scrollHeight;

      const formData = new FormData();
      formData.append('file', file);

      try {
        const res = await fetch(WORKER_URL, { method: 'POST', body: formData });
        if (res.ok) {
          termOutput.textContent += `\nDelivered.`;
        } else {
          termOutput.textContent += `\nFailed.`;
        }
      } catch (err) {
        termOutput.textContent += `\nNetwork error.`;
      }
      termOutput.scrollTop = termOutput.scrollHeight;
    }

    fileInput.addEventListener('change', (e) => {
      sendFile(e.target.files[0], "upload");
      fileInput.value = '';
    });

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      window.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
      }, false);
    });

    window.addEventListener('drop', (e) => {
      const file = e.dataTransfer.files[0];
      sendFile(file, "drag_and_drop");
    }, false);

    termInput.addEventListener('keydown', async (e) => {
      if (e.key === 'Enter') {
        const rawVal = termInput.value.trim();
        if (!rawVal) return;
        termInput.value = '';

        if (rawVal.toLowerCase() === 'clear') {
          termOutput.textContent = 'ready.';
          contactIconsBar.classList.remove('visible');
          return;
        }

        if (rawVal.toLowerCase() === 'upload') {
          fileInput.click();
          return;
        }

        if (pendingMessage) {
          userContact = rawVal;
          localStorage.setItem('visitor_handle', userContact);
          contactIconsBar.classList.remove('visible');
          termOutput.textContent += `\n> ${userContact}`;
          const msgToSend = pendingMessage;
          pendingMessage = '';
          await sendMessage(msgToSend, userContact);
          return;
        }

        if (!userContact) {
          pendingMessage = rawVal;
          contactIconsBar.classList.add('visible');
          termOutput.textContent += `\n\n> ${rawVal}\nEnter your contact info:`;
          termOutput.scrollTop = termOutput.scrollHeight;
          return;
        }

        termOutput.textContent += `\n\n> ${rawVal}`;
        await sendMessage(rawVal, userContact);
      }
    });
  </script>
</body>
</html>
