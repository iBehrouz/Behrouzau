<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Behrouz</title>
  <style>
    :root {
      --bg-color: #0d0d0d;
      --card-bg: #161616;
      --accent-color: #c4823f;
      --text-main: #e0e0e0;
      --text-muted: #888888;
      --border-color: #262626;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: auto;
      text-align: center;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #4CAF50;
      border-radius: 50%;
      box-shadow: 0 0 8px #4CAF50;
    }

    .terminal-window {
      background: #050505;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.25rem;
      text-align: left;
      font-family: monospace;
      font-size: 0.85rem;
      color: #33ff33;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      cursor: text;
    }

    .terminal-output {
      margin-bottom: 0.75rem;
      white-space: pre-wrap;
      line-height: 1.5;
      max-height: 320px;
      overflow-y: auto;
    }

    .terminal-input-line {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-top: 1px solid #1a1a1a;
      padding-top: 0.75rem;
    }

    .prompt-symbol { color: var(--accent-color); font-weight: bold; }

    .terminal-input {
      background: transparent;
      border: none;
      color: #33ff33;
      font-family: monospace;
      outline: none;
      width: 100%;
      font-size: 0.85rem;
    }

    footer { font-size: 0.8rem; color: var(--text-muted); }
    footer a { color: var(--text-muted); text-decoration: none; }
  </style>
</head>
<body>

  <div class="container">
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>Behrouz</span>
    </div>

    <div class="terminal-window" id="terminal-window">
      <div class="terminal-output" id="terminal-output">ready. Type a message or 'upload' to send a file.</div>
      <div class="terminal-input-line">
        <span class="prompt-symbol">&gt;</span>
        <input type="text" class="terminal-input" id="terminal-input" autofocus autocomplete="off" spellcheck="false">
      </div>
    </div>
  </div>

  <footer>
    © 2026 Behrouz. All rights reserved. • <a href="https://behrouz.au">behrouz.au</a>
  </footer>

  <script>
    const WORKER_URL = 'https://codetel.behrouz-4b1.workers.dev';

    const termWindow = document.getElementById('terminal-window');
    const termInput = document.getElementById('terminal-input');
    const termOutput = document.getElementById('terminal-output');

    let userContact = localStorage.getItem('visitor_handle') || '';
    let pendingMessage = '';

    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    document.body.appendChild(fileInput);

    termWindow.addEventListener('click', () => termInput.focus());

    async function sendMessage(msg, contactInfo) {
      termOutput.textContent += `\nSending...`;
      termOutput.scrollTop = termOutput.scrollHeight;

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg, contact: contactInfo || "Anonymous" })
        });

        if (res.ok) {
          termOutput.textContent += `\nDelivered.`;
        } else {
          termOutput.textContent += `\nFailed.`;
        }
      } catch (err) {
        termOutput.textContent += `\nNetwork error.`;
      }
      termOutput.scrollTop = termOutput.scrollHeight;
    }

    async function sendFile(file) {
      if (!file) return;
      termOutput.textContent += `\n\nUploading [${file.name}]...`;
      termOutput.scrollTop = termOutput.scrollHeight;

      const formData = new FormData();
      formData.append('file', file);

      try {
        const res = await fetch(WORKER_URL, { method: 'POST', body: formData });
        if (res.ok) {
          termOutput.textContent += `\nDelivered.`;
        } else {
          termOutput.textContent += `\nFailed.`;
        }
      } catch (err) {
        termOutput.textContent += `\nNetwork error.`;
      }
      termOutput.scrollTop = termOutput.scrollHeight;
    }

    fileInput.addEventListener('change', (e) => {
      sendFile(e.target.files[0]);
      fileInput.value = '';
    });

    termInput.addEventListener('keydown', async (e) => {
      if (e.key === 'Enter') {
        const rawVal = termInput.value.trim();
        if (!rawVal) return;
        termInput.value = '';

        if (rawVal.toLowerCase() === 'clear') {
          termOutput.textContent = 'ready.';
          return;
        }

        if (rawVal.toLowerCase() === 'upload') {
          fileInput.click();
          return;
        }

        if (pendingMessage) {
          userContact = rawVal;
          localStorage.setItem('visitor_handle', userContact);
          termOutput.textContent += `\n> ${userContact}`;
          const msgToSend = pendingMessage;
          pendingMessage = '';
          await sendMessage(msgToSend, userContact);
          return;
        }

        if (!userContact) {
          pendingMessage = rawVal;
          termOutput.textContent += `\n\n> ${rawVal}\n@ or email or number:`;
          termOutput.scrollTop = termOutput.scrollHeight;
          return;
        }

        termOutput.textContent += `\n\n> ${rawVal}`;
        await sendMessage(rawVal, userContact);
      }
    });
  </script>
</body>
</html>
