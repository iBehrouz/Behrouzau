<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Behrouz</title>
  <style>
    :root {
      --bg-color: #080808;
      --card-bg: #121212;
      --accent-color: #c4823f;
      --text-main: #e0e0e0;
      --text-muted: #777777;
      --border-color: #222222;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 3rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 540px;
      margin: auto;
      text-align: center;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 0.5rem 1rem;
      border-radius: 30px;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      letter-spacing: 0.5px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #4CAF50;
      border-radius: 50%;
      box-shadow: 0 0 10px #4CAF50;
    }

    .terminal-window {
      background: #030303;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 1.5rem;
      text-align: left;
      font-family: monospace;
      font-size: 0.88rem;
      color: #33ff33;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      cursor: text;
      position: relative;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .terminal-window.drag-active {
      border-color: var(--accent-color);
      box-shadow: 0 0 25px rgba(196, 130, 63, 0.3);
    }

    .terminal-output {
      margin-bottom: 1rem;
      white-space: pre-wrap;
      line-height: 1.6;
      max-height: 340px;
      overflow-y: auto;
    }

    /* Icon Guide Bar inside the terminal */
    .contact-icons-bar {
      display: none;
      gap: 12px;
      font-size: 0.9rem;
      padding: 6px 0 10px 0;
      color: var(--accent-color);
      border-top: 1px dashed #1c1c1c;
      margin-bottom: 6px;
    }

    .contact-icons-bar.visible {
      display: flex;
    }

    .terminal-input-line {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      border-top: 1px solid #1a1a1a;
      padding-top: 0.85rem;
    }

    .prompt-symbol { color: var(--accent-color); font-weight: bold; }

    .terminal-input {
      background: transparent;
      border: none;
      color: #33ff33;
      font-family: monospace;
      outline: none;
      width: 100%;
      font-size: 0.88rem;
    }

    footer { 
      font-size: 0.8rem; 
      color: var(--text-muted); 
      letter-spacing: 0.5px;
    }
    footer a { color: var(--text-muted); text-decoration: none; }
    footer a:hover { color: var(--accent-color); }
  </style>
</head>
<body>

  <div class="container">
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>behrouz.au • online</span>
    </div>

    <div class="terminal-window" id="terminal-window">
      <div class="terminal-output" id="terminal-output">ready. Type a message.</div>
      
      <!-- Icon bar that shows up when asking for contact info -->
      <div class="contact-icons-bar" id="contactIconsBar">
        <span>💬 @username</span> &nbsp;•&nbsp; <span>✉️ email</span> &nbsp;•&nbsp; <span>📞 number</span>
      </div>

      <div class="terminal-input-line">
        <span class="prompt-symbol">&gt;</span>
        <input type="text" class="terminal-input" id="terminal-input" autofocus autocomplete="off" spellcheck="false">
      </div>
    </div>
  </div>

  <footer>
    © 2026 Behrouz. All rights reserved.
  </footer>

  <script>
    const WORKER_URL = 'https://codetel.behrouz-4b1.workers.dev';

    const termWindow = document.getElementById('terminal-window');
    const termInput = document.getElementById('terminal-input');
    const termOutput = document.getElementById('terminal-output');
    const contactIconsBar = document.getElementById('contactIconsBar');

    let userContact = localStorage.getItem('visitor_handle') || '';
    let pendingMessage = '';

    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    document.body.appendChild(fileInput);

    termWindow.addEventListener('click', () => termInput.focus());

    async function sendMessage(msg, contactInfo) {
      termOutput.textContent += `\nSending...`;
      termOutput.scrollTop = termOutput.scrollHeight;

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg, contact: contactInfo || "Anonymous" })
        });

        if (res.ok) {
          termOutput.textContent += `\nDelivered.`;
        } else {
          termOutput.textContent += `\nFailed.`;
        }
      } catch (err) {
        termOutput.textContent += `\nNetwork error.`;
      }
      termOutput.scrollTop = termOutput.scrollHeight;
    }

    async function sendFile(file, method = "upload") {
      if (!file) return;
      termOutput.textContent += `\n\n> ${method}\nUploading [${file.name}]...`;
      termOutput.scrollTop = termOutput.scrollHeight;

      const formData = new FormData();
      formData.append('file', file);

      try {
        const res = await fetch(WORKER_URL, { method: 'POST', body: formData });
        if (res.ok) {
          termOutput.textContent += `\nDelivered.`;
        } else {
          termOutput.textContent += `\nFailed.`;
        }
      } catch (err) {
        termOutput.textContent += `\nNetwork error.`;
      }
      termOutput.scrollTop = termOutput.scrollHeight;
    }

    fileInput.addEventListener('change', (e) => {
      sendFile(e.target.files[0], "upload");
      fileInput.value = '';
    });

    // Drag and Drop File Handlers
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      window.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
      }, false);
    });

    ['dragenter', 'dragover'].forEach(eventName => {
      window.addEventListener(eventName, () => {
        termWindow.classList.add('drag-active');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      window.addEventListener(eventName, () => {
        termWindow.classList.remove('drag-active');
      }, false);
    });

    window.addEventListener('drop', (e) => {
      const file = e.dataTransfer.files[0];
      sendFile(file, "drag_and_drop");
    }, false);

    termInput.addEventListener('keydown', async (e) => {
      if (e.key === 'Enter') {
        const rawVal = termInput.value.trim();
        if (!rawVal) return;
        termInput.value = '';

        if (rawVal.toLowerCase() === 'clear') {
          termOutput.textContent = 'ready.';
          contactIconsBar.classList.remove('visible');
          return;
        }

        if (rawVal.toLowerCase() === 'upload') {
          fileInput.click();
          return;
        }

        if (pendingMessage) {
          userContact = rawVal;
          localStorage.setItem('visitor_handle', userContact);
          contactIconsBar.classList.remove('visible');
          termOutput.textContent += `\n> ${userContact}`;
          const msgToSend = pendingMessage;
          pendingMessage = '';
          await sendMessage(msgToSend, userContact);
          return;
        }

        if (!userContact) {
          pendingMessage = rawVal;
          contactIconsBar.classList.add('visible'); // Show icons bar
          termOutput.textContent += `\n\n> ${rawVal}\nEnter your contact info:`;
          termOutput.scrollTop = termOutput.scrollHeight;
          return;
        }

        termOutput.textContent += `\n\n> ${rawVal}`;
        await sendMessage(rawVal, userContact);
      }
    });
  </script>
</body>
</html>
