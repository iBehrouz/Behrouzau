<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Behrouz</title>
  <style>
    :root {
      --bg-color: #030303;
      --accent-color: #c4823f;
      --terminal-green: #33ff33;
      --text-main: #e0e0e0;
      --text-muted: #555555;
      --border-color: #161616;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-family);
      width: 100vw;
      height: 100vh;
      height: 100dvh; /* Adapts perfectly to mobile browser toolbars */
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Full-screen immersive terminal shell */
    .terminal-container {
      flex: 1;
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      background: var(--bg-color);
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      cursor: text;
    }

    /* Terminal output fills the available vertical space */
    .terminal-output {
      flex: 1;
      white-space: pre-wrap;
      line-height: 1.6;
      overflow-y: auto;
      font-size: 0.9rem;
      color: var(--terminal-green);
      text-shadow: 0 0 6px rgba(51, 255, 51, 0.2);
      padding-top: 0.5rem;
      padding-bottom: 1rem;
    }

    /* Contact icon guide bar */
    .contact-icons-bar {
      display: none;
      gap: 12px;
      font-size: 0.85rem;
      padding: 8px 0 12px 0;
      color: var(--accent-color);
      border-top: 1px dashed #1a1a1a;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }

    .contact-icons-bar.visible {
      display: flex;
    }

    /* Bottom input fixed line */
    .terminal-input-line {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      border-top: 1px solid var(--border-color);
      padding-top: 1rem;
      padding-bottom: env(safe-area-inset-bottom, 0.5rem); /* Clears iPhone home bar */
      background: var(--bg-color);
    }

    .prompt-symbol { 
      color: var(--accent-color); 
      font-weight: bold; 
      font-size: 1rem; 
    }

    /* 16px prevents iOS/Android auto-zoom */
    .terminal-input {
      background: transparent;
      border: none;
      color: var(--terminal-green);
      font-family: monospace;
      outline: none;
      width: 100%;
      font-size: 16px; 
      text-shadow: 0 0 6px rgba(51, 255, 51, 0.2);
    }
  </style>
</head>
<body>

  <div class="terminal-container" id="terminalContainer">
    <div class="terminal-output" id="terminal-output">ready. Type a message.</div>
    
    <!-- Contact Info Prompt Icons -->
    <div class="contact-icons-bar" id="contactIconsBar">
      <span>💬 @username</span> &nbsp;•&nbsp; <span>✉ email</span> &nbsp;•&nbsp; <span>📞 number</span>
    </div>

    <div class="terminal-input-line">
      <span class="prompt-symbol">&gt;</span>
      <input type="text" class="terminal-input" id="terminal-input" autocomplete="off" spellcheck="false">
    </div>
  </div>

  <script>
    const WORKER_URL = 'https://codetel.behrouz-4b1.workers.dev';

    const terminalContainer = document.getElementById('terminalContainer');
    const termInput = document.getElementById('terminal-input');
    const termOutput = document.getElementById('terminal-output');
    const contactIconsBar = document.getElementById('contactIconsBar');

    let userContact = localStorage.getItem('visitor_handle') || '';
    let pendingMessage = '';

    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    document.body.appendChild(fileInput);

    terminalContainer.addEventListener('click', () => termInput.focus());

    async function sendMessage(msg, contactInfo) {
      termOutput.textContent += `\nSending...`;
      termOutput.scrollTop = termOutput.scrollHeight;

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg, contact: contactInfo || "Anonymous" })
        });

        if (res.ok) {
          termOutput.textContent += `\nDelivered.`;
        } else {
          termOutput.textContent += `\nFailed.`;
        }
      } catch (err) {
        termOutput.textContent += `\nNetwork error.`;
      }
      termOutput.scrollTop = termOutput.scrollHeight;
    }

    async function sendFile(file, method = "upload") {
      if (!file) return;
      termOutput.textContent += `\n\n> ${method}\nUploading [${file.name}]...`;
      termOutput.scrollTop = termOutput.scrollHeight;

      const formData = new FormData();
      formData.append('file', file);

      try {
        const res = await fetch(WORKER_URL, { method: 'POST', body: formData });
        if (res.ok) {
          termOutput.textContent += `\nDelivered.`;
        } else {
          termOutput.textContent += `\nFailed.`;
        }
      } catch (err) {
        termOutput.textContent += `\nNetwork error.`;
      }
      termOutput.scrollTop = termOutput.scrollHeight;
    }

    fileInput.addEventListener('change', (e) => {
      sendFile(e.target.files[0], "upload");
      fileInput.value = '';
    });

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      window.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
      }, false);
    });

    window.addEventListener('drop', (e) => {
      const file = e.dataTransfer.files[0];
      sendFile(file, "drag_and_drop");
    }, false);

    termInput.addEventListener('keydown', async (e) => {
      if (e.key === 'Enter') {
        const rawVal = termInput.value.trim();
        if (!rawVal) return;
        termInput.value = '';

        if (rawVal.toLowerCase() === 'clear') {
          termOutput.textContent = 'ready.';
          contactIconsBar.classList.remove('visible');
          return;
        }

        if (rawVal.toLowerCase() === 'upload') {
          fileInput.click();
          return;
        }

        if (pendingMessage) {
          userContact = rawVal;
          localStorage.setItem('visitor_handle', userContact);
          contactIconsBar.classList.remove('visible');
          termOutput.textContent += `\n> ${userContact}`;
          const msgToSend = pendingMessage;
          pendingMessage = '';
          await sendMessage(msgToSend, userContact);
          return;
        }

        if (!userContact) {
          pendingMessage = rawVal;
          contactIconsBar.classList.add('visible');
          termOutput.textContent += `\n\n> ${rawVal}\nEnter your contact info:`;
          termOutput.scrollTop = termOutput.scrollHeight;
          return;
        }

        termOutput.textContent += `\n\n> ${rawVal}`;
        await sendMessage(rawVal, userContact);
      }
    });
  </script>
</body>
</html>
