<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#060608">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Behrouz</title>
  <style>
    :root {
      --bg-color: #060608;
      --card-bg: #0d0d11;
      --accent-color: #c4823f;
      --terminal-green: #33ff33;
      --text-main: #e0e0e0;
      --text-muted: #666670;
      --border-color: #1a1a22;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .terminal-window {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 1.5rem;
      text-align: left;
      font-family: monospace;
      font-size: 0.9rem;
      color: var(--terminal-green);
      box-shadow: 0 25px 50px rgba(0,0,0,0.8);
      cursor: text;
      position: relative;
    }

    .terminal-window.drag-active {
      border-color: var(--accent-color);
      box-shadow: 0 0 30px rgba(196, 130, 63, 0.25);
    }

    .terminal-output {
      margin-bottom: 1.25rem;
      white-space: pre-wrap;
      line-height: 1.6;
      max-height: 320px;
      overflow-y: auto;
      text-shadow: 0 0 6px rgba(51, 255, 51, 0.2);
    }

    .contact-icons-bar {
      display: none;
      gap: 12px;
      font-size: 0.88rem;
      padding: 8px 0 12px 0;
      color: var(--accent-color);
      border-top: 1px dashed #22222d;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }

    .contact-icons-bar.visible {
      display: flex;
    }

    .terminal-input-line {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      border-top: 1px solid #16161f;
      padding-top: 1rem;
    }

    .prompt-symbol { color: var(--accent-color); font-weight: bold; font-size: 1.05rem; }

    .terminal-input {
      background: transparent;
      border: none;
      color: var(--terminal-green);
      font-family: monospace;
      outline: none;
      width: 100%;
      font-size: 16px;
      text-shadow: 0 0 6px rgba(51, 255, 51, 0.2);
    }

    footer { 
      text-align: center;
      font-size: 0.75rem; 
      color: var(--text-muted); 
      margin-top: 1.5rem;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="terminal-window" id="terminal-window">
      <div class="terminal-output" id="terminal-output">ready. Type a message.</div>
      
      <div class="contact-icons-bar" id="contactIconsBar">
        <span>💬 @username</span> &nbsp;•&nbsp; <span>✉ email</span> &nbsp;•&nbsp; <span>📞 number</span>
      </div>

      <div class="terminal-input-line">
        <span class="prompt-symbol">&gt;</span>
        <input type="text" class="terminal-input" id="terminal-input" autocomplete="off" spellcheck="false">
      </div>
    </div>
    
    <footer>
      © 2026 Behrouz. All rights reserved.
    </footer>
  </div>

  <script>
    const WORKER_URL = 'https://codetel.behrouz-4b1.workers.dev';

    const termWindow = document.getElementById('terminal-window');
    const termInput = document.getElementById('terminal-input');
    const termOutput = document.getElementById('terminal-output');
    const contactIconsBar = document.getElementById('contactIconsBar');

    let userContact = localStorage.getItem('visitor_handle') || '';
    let pendingMessage = '';

    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    document.body.appendChild(fileInput);

    termWindow.addEventListener('click', () => termInput.focus());

    async function sendMessage(msg, contactInfo) {
      termOutput.textContent += `\nThinking...`;
      termOutput.scrollTop = termOutput.scrollHeight;

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg, contact: contactInfo || "Anonymous" })
        });

        if (res.ok) {
          const data = await res.json();
          // Remove "Thinking..." and append AI reply
          termOutput.textContent = termOutput.textContent.replace(`\nThinking...`, ``);
          termOutput.textContent += `\n\n${data.reply || "Delivered."}`;
        } else {
          termOutput.textContent = termOutput.textContent.replace(`\nThinking...`, `\nFailed.`);
        }
      } catch (err) {
        termOutput.textContent = termOutput.textContent.replace(`\nThinking...`, `\nNetwork error.`);
      }
      termOutput.scrollTop = termOutput.scrollHeight;
    }

    async function sendFile(file, method = "upload") {
      if (!file) return;
      termOutput.textContent += `\n\n> ${method}\nUploading [${file.name}]...`;
      termOutput.scrollTop = termOutput.scrollHeight;

      const formData = new FormData();
      formData.append('file', file);

      try {
        const res = await fetch(WORKER_URL, { method: 'POST', body: formData });
        if (res.ok) {
          termOutput.textContent += `\nDelivered.`;
        } else {
          termOutput.textContent += `\nFailed.`;
        }
      } catch (err) {
        termOutput.textContent += `\nNetwork error.`;
      }
      termOutput.scrollTop = termOutput.scrollHeight;
    }

    fileInput.addEventListener('change', (e) => {
      sendFile(e.target.files[0], "upload");
      fileInput.value = '';
    });

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      window.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
      }, false);
    });

    ['dragenter', 'dragover'].forEach(eventName => {
      window.addEventListener(eventName, () => {
        termWindow.classList.add('drag-active');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      window.addEventListener(eventName, () => {
        termWindow.classList.remove('drag-active');
      }, false);
    });

    window.addEventListener('drop', (e) => {
      const file = e.dataTransfer.files[0];
      sendFile(file, "drag_and_drop");
    }, false);

    termInput.addEventListener('keydown', async (e) => {
      if (e.key === 'Enter') {
        const rawVal = termInput.value.trim();
        if (!rawVal) return;
        termInput.value = '';

        if (rawVal.toLowerCase() === 'clear') {
          termOutput.textContent = 'ready.';
          contactIconsBar.classList.remove('visible');
          return;
        }

        if (rawVal.toLowerCase() === 'upload') {
          fileInput.click();
          return;
        }

        if (pendingMessage) {
          userContact = rawVal;
          localStorage.setItem('visitor_handle', userContact);
          contactIconsBar.classList.remove('visible');
          termOutput.textContent += `\n> ${userContact}`;
          const msgToSend = pendingMessage;
          pendingMessage = '';
          await sendMessage(msgToSend, userContact);
          return;
        }

        if (!userContact) {
          pendingMessage = rawVal;
          contactIconsBar.classList.add('visible');
          termOutput.textContent += `\n\n> ${rawVal}\nEnter your contact info:`;
          termOutput.scrollTop = termOutput.scrollHeight;
          return;
        }

        termOutput.textContent += `\n\n> ${rawVal}`;
        await sendMessage(rawVal, userContact);
      }
    });
  </script>
</body>
</html>
